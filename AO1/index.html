<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.svg" type="image/x-icon">
    <title>Peña Bento Layout</title>
      <style>
    .card {
      min-height: 180px;
      /* background-color: grey; */
    }
  </style>
</head>
<body data-bs-theme="dark">
  <div class="container">
    <div class="row">
      <div class="col">
        <div class="h2 text-left m-3">T O N F I T</div>
      </div>
    </div>
  </div>
  <div class="ms-5 me-5 mb-5">
    <div class="row">
      <div class="col-8">
        <div class="row">
          <div class="col-4 p-1">
            <div class="card p-1 h-100">profile</div>
          </div>
          <div class="col-8 d-flex flex-column">
            <div class="row">
              <div class="col-12 p-1">
                <div class="card p-1 h-100">weekly volume</div>
              </div>
            </div>
            <div class="row flex-grow-1">
              <div class="col-6 p-1">
                <div class="card p-1 h-100">personal records</div>
              </div>
              <div class="col-6 p-1">
                <div class="card p-1 h-100">recovery</div>
              </div>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-8 p-1">
            <div class="card p-1">Consistency Matrix</div>
          </div>
          <div class="col-4 p-1">
            <div class="card p-1">Current session</div>
          </div>
        </div>
      </div>
      <div class="col-4 d-flex flex-column gap-2">
        <div class="card p-1">spotify</div>
        <div class="card p-1 flex-grow-1">Daily Protocols</div>
      </div>
    </div>
  </div>
</html>
