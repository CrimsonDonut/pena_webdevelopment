<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TonBITS - MLBB HERO STATS VIEWER</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="theme.css" rel="stylesheet">
</head>

<body data-bs-theme="dark">
    <main class="container-fluid py-4 py-md-5 d-flex flex-column gap-3">
        <header class="card p-4">
            <h1 class="page-title h2 mb-1">TONBITS - MLBB Hero Stats Viewer</h1>
            <p class="text-body-secondary mb-0">Last 7 days, <span id="rank-label">all ranks</span>. Select a hero to see its performance trends.</p>
        </header>

        <div class="search-wrap">
            <span class="material-symbols-outlined" aria-hidden="true">search</span>
            <input id="search" type="search" class="form-control form-control-lg" placeholder="Search heroes"
                aria-label="Search heroes" autocomplete="off">
        </div>

        <div class="d-flex flex-wrap align-items-center gap-2">
            <select id="rank" class="form-select w-auto" aria-label="Filter by rank">
                <option value="all" selected>All ranks</option>
                <option value="epic">Epic</option>
                <option value="legend">Legend</option>
                <option value="mythic">Mythic</option>
                <option value="honor">Mythical Honor</option>
                <option value="glory">Mythical Glory</option>
            </select>

            <div id="lane" class="lane-pills" role="group" aria-label="Filter by position">
                <button type="button" data-lane="all" class="active">All lanes</button>
                <button type="button" data-lane="gold">Gold lane</button>
                <button type="button" data-lane="exp">EXP lane</button>
                <button type="button" data-lane="mid">Mid</button>
                <button type="button" data-lane="roam">Roam</button>
                <button type="button" data-lane="jungle">Jungle</button>
            </div>

            <div class="d-flex align-items-center gap-2 ms-md-auto">
                <select id="metric" class="form-select w-auto" aria-label="Sort by">
                    <option value="win" selected>Sort by win rate</option>
                    <option value="pick">Sort by pick rate</option>
                    <option value="ban">Sort by ban rate</option>
                </select>
                <button id="dir" type="button" class="btn btn-dir" aria-label="Sort direction: high to low">High → Low</button>
            </div>
        </div>

        <div id="loading" class="text-center py-4" hidden>
            <div class="spinner-border text-light" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <div class="mt-2 status-line">Loading heroes...</div>
        </div>
        <div id="status" class="status-line px-1" role="status"></div>

        <section id="list" class="hero-list" aria-label="Heroes"></section>

        <nav class="mt-3" aria-label="Hero pages">
            <ul id="pager" class="pagination mb-0"></ul>
        </nav>
    </main>

    <div class="modal fade" id="hero-modal" tabindex="-1" aria-labelledby="hero-title" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <div class="d-flex align-items-center gap-3">
                        <img id="hero-img" class="avatar-lg" alt="">
                        <div>
                            <h2 class="h4 mb-0 text-white" id="hero-title"></h2>
                            <div id="hero-sub" class="text-body-secondary small"></div>
                        </div>
                    </div>
                    <button type="button" class="btn-close align-self-start" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="d-flex flex-wrap justify-content-between gap-2 mb-3">
                        <div class="btn-group btn-group-sm seg" role="group" aria-label="Metric" id="trend-metrics">
                            <button type="button" class="btn btn-outline-primary" data-metric="win">Win rate</button>
                            <button type="button" class="btn btn-outline-primary" data-metric="pick">Pick rate</button>
                            <button type="button" class="btn btn-outline-primary" data-metric="ban">Ban rate</button>
                        </div>
                        <div class="btn-group btn-group-sm seg" role="group" aria-label="Time window" id="trend-days">
                            <button type="button" class="btn btn-outline-primary" data-days="7">7 days</button>
                            <button type="button" class="btn btn-outline-primary" data-days="15">15 days</button>
                            <button type="button" class="btn btn-outline-primary" data-days="30">30 days</button>
                        </div>
                    </div>
                    <div id="trend-body" aria-live="polite"></div>
                </div>
            </div>
        </div>
    </div>

    <footer class="site-footer mt-5 py-4">
        <div class="container text-center">
            Powered by Rone Arena API. Game data © Moonton (Mobile Legends). API maintained by ridwaanhall / RoneAI.
            Unofficial project, not affiliated with Moonton.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
