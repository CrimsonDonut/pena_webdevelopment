<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link href="" rel="icon">
    <title>Document</title>
    <style>
        body {
            background-color: #f4f6f8;
        }

        .character-card {
            max-width: 620px;
            border-radius: 1.25rem;
        }

        .character-image {
            width: 120px;
            height: 120px;
            object-fit: 100%;
            background-color: #eef2f6;
        }

        #description {
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="card character-card border-0 shadow-sm p-4 p-md-5 text-center">
            <form id="search-form" class="input-group mb-4">
                <input type="text" id="character-name" class="form-control" placeholder="Enter a character name" aria-label="Character name">
                <button class="btn btn-primary" type="submit">Search</button>
            </form>
            <div class="mb-4">
                <img src="" id="image" class="character-image rounded-circle" alt="Character portrait">
            </div>
            <h1 id="name" class="h2 mb-3 text-dark">Character Name</h1>
            <p id="description" class="mb-0 text-secondary">Character Description</p>
        </div>
    </main>
    
</body>
<script>
    var elName = document.getElementById('name');
    var elImage = document.getElementById('image');
    var elDescription = document.getElementById('description');
    var inInput = document.getElementById('character-name');
    var searchForm = document.getElementById('search-form');

    const getDBZ = async (name = 'Vegeta') => {
        const response = await fetch('https://dragonball-api.com/api/characters?name=' + (name));
        const data = await response.json();
        const character = data[0];
        elImage.src = character.image;
        elDescription.innerHTML = character.description;
        elName.innerHTML = character.name;
    };

    searchForm.addEventListener('submit', (event) => {
        event.preventDefault();
        getDBZ(inInput.value.trim());
    });

    getDBZ();

</script>
</html>
